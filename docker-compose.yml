services:
  hh_applicant_tool:
    container_name: hh_applicant_tool
    image: hh_applicant_tool:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      # Конфиг и БД хранятся на хосте — переживут пересборки образа.
      # Внутри контейнера CONFIG_DIR=/app/config (см. env ниже и Dockerfile).
      - ./config:/app/config
      # Таймзона хоста (чтобы cron в контейнере работал в твоё время).
      - /etc/localtime:/etc/localtime:ro
    environment:
      # Папка для config.json / hh.sqlite / cookies.txt внутри контейнера.
      - CONFIG_DIR=/app/config
      # Терминал нужен для kitty/sixel-вывода (можно закомментировать).
      - TERM=${TERM:-xterm}
      # Если время сервера отличается от Москвы — раскомментируй:
      # - TZ=Europe/Moscow
    # Поднимать веб-UI наружу не обязательно: всё работает через cron внутри.
    # Если нужен UI — раскомментируй и используй команду `ui` вместо cron.
    # ports:
    #   - "127.0.0.1:8000:8000"
